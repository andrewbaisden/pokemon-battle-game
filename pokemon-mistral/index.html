<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Battle</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <div id="player">
            <img id="player-sprite" src="" alt="Player Pokémon">
            <div id="player-info">
                <p>Name: <span id="player-name"></span></p>
                <p>Level: <span id="player-level"></span></p>
                <p>HP: <span id="player-hp"></span></p>
            </div>
            <div id="player-moves">
                <button id="move1">Move 1</button>
                <button id="move2">Move 2</button>
                <button id="move3">Move 3</button>
                <button id="move4">Move 4</button>
            </div>
            <button id="switch-pokemon">Switch Pokémon</button>
        </div>
        <div id="enemy">
            <img id="enemy-sprite" src="" alt="Enemy Pokémon">
            <div id="enemy-info">
                <p>Name: <span id="enemy-name"></span></p>
                <p>Level: <span id="enemy-level"></span></p>
                <p>HP: <span id="enemy-hp"></span></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
