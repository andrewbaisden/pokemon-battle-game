<!DOCTYPE html>
<html>
<head>
    <title>Pokemon Battle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="battle-container">
        <div class="player-pokemon-area">
            <div id="player-pokemon-sprite"></div>
            <div id="player-pokemon-hp"></div>
            <div id="player-pokemon-name"></div>
        </div>
        <div class="enemy-pokemon-area">
            <div id="enemy-pokemon-sprite"></div>
            <div id="enemy-pokemon-hp"></div>
            <div id="enemy-pokemon-name"></div>
        </div>
        <div class="battle-log" id="battle-log">
            </div>
        <div class="action-buttons" id="action-buttons">
            </div>
        <div class="switch-pokemon-area" id="switch-pokemon-area">
            </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
